name: Build and publish inventory prerelease
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify
        run: bash scripts/build-release.sh
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-rc.1
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release already exists"; exit 0; fi
          gh release create "$tag" dist/Sibyl.inventory-"$tag".zip dist/Sibyl.inventory-"$tag".zip.sha256 --target "$GITHUB_SHA" --prerelease --title "Sibyl.inventory $tag" --notes-file RELEASE_NOTES.md
