<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sibyl · Inventar</title>
<style>
:root{color-scheme:light dark;font:15px/1.6 system-ui,sans-serif}body{max-width:1000px;margin:25px auto;padding:18px}h1{font-size:30px}a{color:inherit}label{display:block;margin:14px 0}input,textarea,button{font:inherit;padding:8px;border:1px solid #888}input{min-width:260px}textarea{width:100%;height:72px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #888;padding:6px;text-align:left}.sub{opacity:.75}#rows{max-height:420px;overflow:auto}header{display:flex;justify-content:space-between;align-items:center}</style></head><body>
<header><h1>Inventar</h1><a href="/">← Sibyl System</a></header>
<p class="sub">Eigenständige Addon-Oberfläche: IPv4-/IPAM-Übersicht mit freien, reservierten und belegten Adressen. Dieser erste Stand verarbeitet Eingaben lokal; automatische AD-, DHCP- und ICMP-Collector folgen.</p>
<label>IPv4-Netzwerk <input id="cidr" value="192.168.10.0/29" aria-label="IPv4-Netzwerk"></label>
<label>DHCP-Leases (IP zu Gerätename, JSON)<textarea id="leases">{ "192.168.10.3": "Client-03" }</textarea></label>
<label>Reservierungen (IP-Liste, Komma-getrennt)<input id="reserved" value="192.168.10.5"></label>
<button id="render">Adressübersicht erzeugen</button><p id="status" role="status"></p><div id="rows"></div>
<script>
"use strict";
const ip=(value)=>{const p=value.split(".");if(p.length!==4)throw Error("IPv4 falsch");
 let x=0;for(const s of p){if(!/^(0|[1-9][0-9]{0,2})$/.test(s)||+s>255)throw Error("IPv4 falsch");x=(x*256+ +s)>>>0;}return x>>>0;};
const address=(n)=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
document.getElementById("render").onclick=()=>{
 const status=document.getElementById("status"), rows=document.getElementById("rows");rows.replaceChildren();
 try{
  const [v,p]=document.getElementById("cidr").value.trim().split("/");
  const prefix=Number(p);if(!Number.isInteger(prefix)||prefix<24||prefix>30)throw Error("Nur /24 bis /30 in dieser Vorschau");
  const addr=ip(v), hosts=2**(32-prefix),start=Math.floor(addr/hosts)*hosts;
  if(start!==addr)throw Error("Bitte Netzwerkadresse eingeben");
  const leases=JSON.parse(document.getElementById("leases").value);
  if(!leases||Array.isArray(leases)||typeof leases!=="object")throw Error("DHCP-JSON ungültig");
  const reserved=new Set(document.getElementById("reserved").value.split(",").map(x=>x.trim()).filter(Boolean));
  const tbl=document.createElement("table"),hdr=document.createElement("tr");
  for(const v of ["Adresse","Zustand","Bezeichnung"]){const h=document.createElement("th");h.textContent=v;hdr.append(h);}tbl.append(hdr);
  for(let i=1;i<hosts-1;i++){
   const a=address(start+i),lease=Object.hasOwn(leases,a)?String(leases[a]):"",tr=document.createElement("tr");
   for(const v of [a,lease?"DHCP-Lease":reserved.has(a)?"Reserviert":"Frei",lease]){
    const td=document.createElement("td");td.textContent=v;tr.append(td);}
   tbl.append(tr);
  }
  rows.append(tbl);status.textContent=(hosts-2)+" nutzbare IPv4-Adressen";
 }catch(e){status.textContent="Fehler: "+e.message;}
};
document.getElementById("render").click();
</script></body></html>
